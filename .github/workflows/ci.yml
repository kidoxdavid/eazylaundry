name: CI
on:
  push: { branches: [main, "claude/**"] }
  pull_request:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGSUPER_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/db-bootstrap.sh
      - run: pnpm typecheck
      # Includes the blocking tenant-isolation suites (apps/api/test/isolation.*.test.ts)
      - run: pnpm test

  # Builds the real images and exercises the staging stack end to end (nginx -> API -> Postgres with the least-privilege roles).
  docker-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Create throwaway staging env
        run: |
          {
            for v in POSTGRES_SUPERUSER_PASSWORD EAZY_OWNER_PASSWORD EAZY_APP_PASSWORD EAZY_WORKER_PASSWORD EAZY_PLATFORM_PASSWORD APP_ENCRYPTION_SECRET; do echo "$v=$(openssl rand -hex 24)"; done
            echo "PUBLIC_WEB_URL=http://localhost:8080"
            echo "SESSION_COOKIE_SECURE=false"
          } > .env.staging
      - name: Build and start
        run: docker compose -f docker-compose.staging.yml --env-file .env.staging up -d --build --wait --wait-timeout 300
      - name: Smoke test
        run: bash scripts/smoke-staging.sh http://localhost:8080
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.staging.yml --env-file .env.staging logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.staging.yml --env-file .env.staging down -v

# Local development services. Roles/DBs are created by scripts/db-bootstrap.sh (or the init script below).
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres }
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data", "./infrastructure/docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  mailpit:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]
volumes: { pgdata: {} }
